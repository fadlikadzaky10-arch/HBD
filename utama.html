<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>utama</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        linear-gradient(135deg, #c600d9 0%, #8b008f 45%, #5d006d 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #17175f;
    }

    /* Latar belakang seperti jendela aplikasi */
    .window-bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .window {
      position: absolute;
      width: 70vw;
      height: 55vh;
      background: rgba(255,255,255,.20);
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.35);
    }

    .window.one {
      left: -10%;
      top: 8%;
      transform: rotate(-3deg);
    }

    .window.two {
      right: -10%;
      bottom: 5%;
      transform: rotate(2deg);
    }

    .main-window {
      position: relative;
      z-index: 2;
      width: min(850px, 94vw);
      min-height: 500px;
      background: rgba(245, 248, 255, .94);
      border-radius: 22px;
      box-shadow: 0 30px 80px rgba(30, 0, 45, .4);
      padding: 18px 25px 35px;
    }

    .topbar {
      display: flex;
      gap: 7px;
      align-items: center;
      margin-bottom: 45px;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
    }

    .red { background: #ff5f57; }
    .yellow { background: #ffbd2e; }
    .green { background: #28c840; }

    h1 {
      text-align: center;
      font-size: clamp(22px, 4vw, 38px);
      color: #22228c;
      margin-bottom: 42px;
      font-weight: 800;
    }

    .choices {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: clamp(20px, 5vw, 55px);
      flex-wrap: wrap;
    }

    .choice {
      width: 190px;
      text-align: center;
      text-decoration: none;
      color: #222;
      transition: transform .2s ease;
    }

    .choice:hover {
      transform: translateY(-8px);
    }

    .icon {
      width: 150px;
      height: 150px;
      margin: auto;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 25px rgba(0,0,0,.15);
    }

    /* Ikon kalender */
    .calendar {
      background: linear-gradient(145deg, #fff, #e8edf4);
      overflow: hidden;
      position: relative;
      border: 1px solid #ddd;
    }

    .calendar .month {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;
      background: #df2338;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 25px;
      font-weight: 800;
    }

    .calendar .day {
      margin-top: 35px;
      font-size: 65px;
      font-weight: 800;
      color: #17223c;
    }

    /* Ikon pesan */
    .mail {
      background: linear-gradient(145deg, #3026dd, #1c54e8);
      position: relative;
    }

    .envelope {
      width: 105px;
      height: 76px;
      border: 4px solid white;
      position: relative;
      overflow: hidden;
    }

    .envelope::before,
    .envelope::after {
      content: "";
      position: absolute;
      width: 72px;
      height: 4px;
      background: white;
      top: 22px;
    }

    .envelope::before {
      left: -12px;
      transform: rotate(34deg);
    }

    .envelope::after {
      right: -12px;
      transform: rotate(-34deg);
    }

    .label {
      margin-top: 18px;
      font-size: 17px;
      font-weight: 700;
      color: #333;
    }

    .description {
      margin-top: 10px;
      color: #666;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .main-window {
        padding: 16px 15px 30px;
      }

      .topbar {
        margin-bottom: 30px;
      }

      h1 {
        margin-bottom: 30px;
      }

      .icon {
        width: 130px;
        height: 130px;
      }

      .choice {
        width: 150px;
      }

      .calendar .day {
        font-size: 56px;
      }
    }
  </style>
</head>

<body>

  <div class="window-bg">
    <div class="window one"></div>
    <div class="window two"></div>
  </div>

  <main class="main-window">

    <div class="topbar">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
    </div>

    <h1>“Pick what u wanna see first”</h1>

    <section class="choices">

      <!-- MENU 1: Kalender -->
      <a class="choice" href="birthday-cake.html">
        <div class="icon calendar">
          <div class="month">SEP</div>
          <div class="day">17</div>
        </div>
        <div class="label">Make a wish!</div>
        <div class="description">Buat sebuah harapan ✨</div>
      </a>

      <!-- MENU 2: Pesan -->
      <a class="choice" href="message.html">
        <div class="icon mail">
          <div class="envelope"></div>
        </div>
        <div class="label">Words for u!</div>
        <div class="description">Ada pesan khusus untukmu 💌</div>
      </a>

    </section>

  </main>

</body>
</html>
